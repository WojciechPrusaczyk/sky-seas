plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 ships Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// GameTests live in their own source set, so they never end up in the mod jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Dev server in run/ (server.properties: online-mode=false, level-type=skyseas:sky_seas).
        // 8 GB heap for pregeneration and benchmarks.
        server {
            server()
            programArgument '--nogui'
            jvmArgument '-Xmx8G'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Runs all registered GameTests, then exits. Own directory: the GameTest server
        // creates a flat "world" that runServer would otherwise load from run/.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.gametest)

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // Structure spawn conditions (spec "Struktury"). Compiled against the oldest version seen in
    // target modpacks; required at runtime (neoforge.mods.toml).
    compileOnly "maven.modrinth:lithostitched:${lithostitched_version}"
    localRuntime "maven.modrinth:lithostitched:${lithostitched_version}"
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Copies the mod jar into a launcher instance for in-game tests with a real modpack.
// Target: -PinstanceMods=<dir> or the Prism Launcher "SkySeas modpack" instance. Older skyseas jars there are removed.
def instanceMods = providers.gradleProperty('instanceMods').getOrElse(
        "${System.getProperty('user.home')}/.local/share/PrismLauncher/instances/SkySeas modpack/minecraft/mods")
tasks.register('installModpack', Copy) {
    dependsOn tasks.named('jar')
    from tasks.named('jar')
    into instanceMods
    def target = file(instanceMods)
    def prefix = "${mod_id}-"
    doFirst {
        target.listFiles()?.findAll { it.name.startsWith(prefix) && it.name.endsWith('.jar') }?.each { it.delete() }
    }
}
